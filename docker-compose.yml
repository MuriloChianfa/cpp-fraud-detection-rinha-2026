x-image: &image
  image: ghcr.io/murilochianfa/cpp-fraud-detection-rinha-2026:latest

x-rinha-net-sysctls: &rinha-net-sysctls
  net.core.somaxconn: "65535"
  net.ipv4.tcp_fastopen: "3"
  net.ipv4.tcp_tw_reuse: "1"
  net.ipv4.tcp_no_metrics_save: "1"
  net.ipv4.tcp_slow_start_after_idle: "0"
  net.ipv4.tcp_autocorking: "0"
  net.ipv4.tcp_notsent_lowat: "16384"
  net.ipv4.tcp_fin_timeout: "10"
  net.ipv4.tcp_max_syn_backlog: "8192"
  net.ipv4.ip_local_port_range: "10000 65535"

x-rinha-ulimits: &rinha-ulimits
  nofile:
    soft: 1048576
    hard: 1048576
  memlock: -1

services:
  api1:
    <<: *image
    pull_policy: always
    command: ["/api", "8001"]
    networks:
      - rinha
    sysctls: *rinha-net-sysctls
    ulimits: *rinha-ulimits
    cpuset: "0"
    deploy:
      resources:
        limits:
          cpus: "0.27"
          memory: "165M"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8001/ready || exit 1"]
      interval: 5s
      timeout: 1s
      retries: 30

  api2:
    <<: *image
    command: ["/api", "8002"]
    networks:
      - rinha
    sysctls: *rinha-net-sysctls
    ulimits: *rinha-ulimits
    cpuset: "3"
    deploy:
      resources:
        limits:
          cpus: "0.27"
          memory: "165M"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8002/ready || exit 1"]
      interval: 5s
      timeout: 1s
      retries: 30

  lb:
    <<: *image
    command: ["/lb", "9999", "api1:8001", "api2:8002"]
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    ports:
      - "9999:9999"
    networks:
      - rinha
    sysctls: *rinha-net-sysctls
    ulimits: *rinha-ulimits
    cpuset: "1,2"
    deploy:
      resources:
        limits:
          cpus: "0.46"
          memory: "20M"

networks:
  rinha:
    driver: bridge
